<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Vintage Celebration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="portal-container">
    <h1>Chapter 22: The Birthday Dispatches</h1>
    <p class="subtitle">An interactive countdown created just for you</p>

    <div class="cards-grid">
      <!-- Change the dates in openDay('YYYY-MM-DD', ...) to her actual birthday dates! -->
      <div class="card" onclick="openDay('2026-10-10', 'day1.html')">
        <span class="badge">Day 1</span>
        <h2>The Vintage Passport</h2>
        <p>Unlocks 2 Days Before</p>
      </div>

      <div class="card" onclick="openDay('2026-10-11', 'day2.html')">
        <span class="badge">Day 2</span>
        <h2>The Lily Botanical Lounge</h2>
        <p>Unlocks 1 Day Before</p>
      </div>

      <div class="card" onclick="openDay('2026-10-12', 'day3.html')">
        <span class="badge">Main Event</span>
        <h2>The 22nd Celebration Vault</h2>
        <p>Unlocks on Her Birthday</p>
      </div>
    </div>
  </div>

  <script>
    function openDay(targetDateStr, pageUrl) {
      const targetDate = new Date(targetDateStr + "T00:00:00");
      const now = new Date();

      if (now >= targetDate) {
        window.location.href = pageUrl;
      } else {
        alert("Patience! This vintage dispatch doesn't open until " + targetDate.toLocaleDateString());
      }
    }
  </script>
</body>
</html>
