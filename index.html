<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Vintage Celebration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="portal-container">
    <h1>Chapter 22: The Birthday Dispatches</h1>
    <p class="subtitle">An interactive countdown created just for you</p>

    <div class="cards-grid">
      <div class="card" onclick="openDay('day1.html')">
        <span class="badge">Day 1</span>
        <h2>The Vintage Passport</h2>
        <p>Unlocks 2 Days Before</p>
      </div>

      <div class="card" onclick="openDay('day2.html')">
        <span class="badge">Day 2</span>
        <h2>The Lily Botanical Lounge</h2>
        <p>Unlocks 1 Day Before</p>
      </div>

      <div class="card" onclick="openDay('day3.html')">
        <span class="badge">Main Event</span>
        <h2>The 22nd Celebration Vault</h2>
        <p>Unlocks on Her Birthday</p>
      </div>
    </div>
  </div>

  <script>
    function openDay(pageUrl) {
      // Opens immediately without date check so you can test everything
      window.location.href = pageUrl;
    }
  </script>
</body>
</html>
