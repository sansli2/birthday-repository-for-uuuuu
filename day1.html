<!DOCTYPE html>
<html lang="en">
<head>

  <div class="portal-container">
    <span class="badge">2 Days Before</span>
    <h1>Passport to 22</h1>

    <div style="border: 2px solid #D4AF37; padding: 25px; background: #FFFDF9; margin-top: 20px;">
      <h2 style="margin-top:0;">Boarding Pass: Flight #22</h2>
      <p><strong>Passenger:</strong> Bestie</p>
      <p><strong>Destination:</strong> The Best Year Yet</p>
      <p><strong>Seat:</strong> First Class</p>
      <hr style="border: 0; border-top: 1px dashed #D4AF37; margin: 15px 0;">
      <p><em>Click the stamps below to reveal special notes!</em></p>
      
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button onclick="alert('Stamp #1: To more late-night food adventures together!')" style="padding: 10px 15px; background: #2B1B17; color: #D4AF37; border: none; cursor: pointer; font-family: inherit;">Paris Stamp</button>
        <button onclick="alert('Stamp #2: May this year bring you closer to all your dream travels!')" style="padding: 10px 15px; background: #2B1B17; color: #D4AF37; border: none; cursor: pointer; font-family: inherit;">Tokyo Stamp</button>
        <button onclick="alert('Stamp #3: Valid for 1 free dinner anywhere you choose!')" style="padding: 10px 15px; background: #2B1B17; color: #D4AF37; border: none; cursor: pointer; font-family: inherit;">Food Voucher Stamp</button>
      </div>
    </div>

    <br><br>
    <a href="index.html" style="color: #2B1B17; text-decoration: underline;">&larr; Back to Main Portal</a>
